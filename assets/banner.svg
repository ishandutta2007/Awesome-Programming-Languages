<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.8" />
    </linearGradient>

    <radialGradient id="radialGlow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radialGlow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.2" />
      <circle cx="40" cy="40" r="1" fill="#38BDF8" fill-opacity="0.25" />
    </pattern>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.04); }
      }
      @keyframes waveFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -400; }
      }
      @keyframes orbitParticle {
        0% { transform: rotate(0deg) translateX(35px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(35px) rotate(-360deg); }
      }

      .floating-tag-1 { animation: floatSlow 7s ease-in-out infinite; }
      .floating-tag-2 { animation: floatReverse 8.5s ease-in-out infinite; }
      .floating-tag-3 { animation: floatSlow 6s ease-in-out infinite 1s; }
      .floating-tag-4 { animation: floatReverse 9s ease-in-out infinite 0.5s; }
      .pulsing-glow { animation: pulseGlow 5s ease-in-out infinite; transform-origin: center; }
      .sine-wave {
        stroke-dasharray: 12, 12;
        animation: waveFlow 25s linear infinite;
      }
      .math-symbol {
        font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        fill: #64748B;
        opacity: 0.45;
      }
      .tag-bg {
        fill: #1E293B;
        stroke: #334155;
        stroke-width: 1;
        rx: 18;
      }
      .tag-text {
        font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 500;
        fill: #94A3B8;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="250" cy="120" r="320" fill="url(#radialGlow1)" class="pulsing-glow" />
  <circle cx="950" cy="300" r="360" fill="url(#radialGlow2)" class="pulsing-glow" />

  <!-- Subtle Geometric Grid -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Waveform & Mathematical Curves in the Background (Behind text) -->
  <g opacity="0.35">
    <!-- Sine curve 1 -->
    <path class="sine-wave" d="M -50 210 Q 150 90, 350 210 T 750 210 T 1150 210 T 1350 210" 
          fill="none" stroke="#38BDF8" stroke-width="2.5" />
    <!-- Cosine curve 2 -->
    <path class="sine-wave" d="M -50 250 Q 200 360, 450 240 T 900 240 T 1300 240" 
          fill="none" stroke="#A855F7" stroke-width="2" stroke-opacity="0.7" />
  </g>

  <!-- Floating Mathematical Symbols & Notation (Background Layer) -->
  <g class="floating-tag-1">
    <text x="140" y="95" class="math-symbol" font-size="28">∫ f(x) dx</text>
    <text x="1020" y="110" class="math-symbol" font-size="26">∇ × B = μ₀J</text>
  </g>
  <g class="floating-tag-2">
    <text x="80" y="340" class="math-symbol" font-size="32">λ f.(λ x. f (x x))</text>
    <text x="1050" y="320" class="math-symbol" font-size="30">∑ (xᵢ - μ)² / n</text>
  </g>
  <g class="floating-tag-3">
    <text x="280" y="70" class="math-symbol" font-size="22">∂²u/∂t² = c²∇²u</text>
    <text x="880" y="85" class="math-symbol" font-size="24">A = U Σ Vᵀ</text>
  </g>

  <!-- Floating Subtle Ecosystem Badges (Background/Sides) -->
  <g class="floating-tag-4" transform="translate(60, 160)">
    <rect width="105" height="34" class="tag-bg" />
    <circle cx="20" cy="17" r="6" fill="#F97316" />
    <text x="34" y="21" class="tag-text">Julia</text>
  </g>
  <g class="floating-tag-3" transform="translate(1030, 170)">
    <rect width="115" height="34" class="tag-bg" />
    <circle cx="20" cy="17" r="6" fill="#22C55E" />
    <text x="34" y="21" class="tag-text">Python</text>
  </g>
  <g class="floating-tag-2" transform="translate(90, 240)">
    <rect width="90" height="34" class="tag-bg" />
    <circle cx="20" cy="17" r="6" fill="#3B82F6" />
    <text x="34" y="21" class="tag-text">R Lang</text>
  </g>
  <g class="floating-tag-1" transform="translate(1010, 245)">
    <rect width="100" height="34" class="tag-bg" />
    <circle cx="20" cy="17" r="6" fill="#EF4444" />
    <text x="34" y="21" class="tag-text">Rust</text>
  </g>

  <!-- FOREGROUND CONTENT: Header Tag, Title, Subtitle, Highlights -->

  <!-- Top Pill / Status Tag -->
  <g transform="translate(425, 48)">
    <rect width="350" height="34" rx="17" fill="#1E293B" stroke="#475569" stroke-opacity="0.8" stroke-width="1.2" />
    <circle cx="22" cy="17" r="5" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="38" y="22" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="12" font-weight="700" fill="#E2E8F0" letter-spacing="1.5">CURATED TECH COMPUTING ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <g filter="url(#shadow)">
    <text x="600" y="160" text-anchor="middle"
          font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="54" font-weight="900" letter-spacing="-0.5" fill="url(#primaryGrad)">
      Awesome Programming Languages
    </text>
  </g>

  <!-- Subtitle -->
  <g filter="url(#shadow)">
    <text x="600" y="215" text-anchor="middle"
          font-family="'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="20" font-weight="500" fill="#E2E8F0" letter-spacing="0.2">
      Numerical Computing  •  Statistical Analysis  •  Symbolic Mathematics  •  HPC
    </text>
  </g>

  <!-- Description line -->
  <text x="600" y="250" text-anchor="middle"
        font-family="'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="14" font-weight="400" fill="#94A3B8" letter-spacing="0.1">
    Tracking leading SaaS platforms, enterprise environments, and high-performance open-source runtimes
  </text>

  <!-- Bottom Feature Badges / Highlights -->
  <g transform="translate(145, 305)">
    <!-- Feature 1 -->
    <g transform="translate(0, 0)">
      <rect width="205" height="42" rx="21" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
      <text x="24" y="26" font-size="16">⚡</text>
      <text x="50" y="26" font-family="'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="13" font-weight="600" fill="#F1F5F9">High-Performance</text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(225, 0)">
      <rect width="220" height="42" rx="21" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
      <text x="24" y="26" font-size="16">📊</text>
      <text x="50" y="26" font-family="'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="13" font-weight="600" fill="#F1F5F9">Statistical Platforms</text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(465, 0)">
      <rect width="215" height="42" rx="21" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
      <text x="24" y="26" font-size="16">🔬</text>
      <text x="50" y="26" font-family="'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="13" font-weight="600" fill="#F1F5F9">Symbolic CAS Engines</text>
    </g>

    <!-- Feature 4 -->
    <g transform="translate(700, 0)">
      <rect width="210" height="42" rx="21" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
      <text x="24" y="26" font-size="16">🌐</text>
      <text x="50" y="26" font-family="'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="13" font-weight="600" fill="#F1F5F9">Open-Source Runtimes</text>
    </g>
  </g>

  <!-- Accent Bottom Border Line -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#primaryGrad)" />
</svg>
